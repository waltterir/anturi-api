services:
  api:
    build: .
    container_name: anturi-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://anturi_user:anturi_pass@db:5432/anturi_db
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: anturi_db
    environment:
      POSTGRES_USER: anturi_user
      POSTGRES_PASSWORD: anturi_pass
      POSTGRES_DB: anturi_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: